services:
  backend:
    build: ./back
    container_name: my-app-backend
    ports:
      - "5000:5000" 
    environment:
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-for-flashcards}
      - DB_PATH=/app/database.db
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_API_FOLDER=${LLM_API_FOLDER:-}
      - LLM_FOLDER_ID=${LLM_FOLDER_ID:-}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-2000}
    volumes:
      - ./back/database.db:/app/database.db
    restart: always

  frontend:
    build: ./frontend
    container_name: my-app-frontend
    ports:
      - "5173:5173" 
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SALUTE_TOKEN=${VITE_SALUTE_TOKEN:-}
      - VITE_SALUTE_SMARTAPP=${VITE_SALUTE_SMARTAPP:-}
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
    depends_on:
      - backend
    restart: always
